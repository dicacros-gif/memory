name: Daily Intelligence Agent - Crawl & Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/live.json"
      - "data/price-history.json"
      - "data/market-history.json"
      - "data/quant.json"
      - "data/quant-backtest.json"
      - "data/crawl-audit.json"
      - "data/crawl-quarantine.json"
      - "data/data-manifest.json"
      - "data/live-client.json"
      - "data/quant-client.json"
      - "data/price-history-client.json"
      - "data/market-history-client.json"
      - "data/quant-backtest-client.json"
      - "data/decision-history-client.json"
      - "data/landing-decision-client.json"
      - "data/site-content-client.json"
      - "data/site-content-extended-client.json"
      - "data/company-directory-client.json"
      - "data/insight-ledger.json"
      - "data/company-signals.json"
      - "data/memory-demand.json"
      - "data/silicon-map.json"
      - "data/pain-points.json"
      - "data/org-signals.json"
      - "data/executive-latest.json"
      - "console/index.html"
      - "data/translation-cache.json"
      - "data/refresh-events.json"
      - "data/refresh-status.json"
  schedule:
    # Four reconciliation runs per day keep the free translation endpoint
    # stable; repository_dispatch remains the low-latency event path.
    - cron: "17 */6 * * *"
  repository_dispatch:
    # Webhook/RSS relays use repository_dispatch as the low-latency path.
    # The six-hour schedule below remains the reconciliation safety poll.
    types: [earnings-release, press-release, filing-update, industry-report, source-update]
  workflow_dispatch:
    inputs:
      refresh_scope:
        description: "Refresh scope"
        required: true
        default: "full"
        type: choice
        options: [full, earnings, market, retrieval]

permissions:
  contents: write

concurrency:
  group: intelligence-agent
  # UI and strategy updates can arrive while a long crawl is running. Preserve
  # the active verified refresh and queue the newest run so frequent design
  # pushes cannot starve news freshness by repeatedly cancelling the crawler.
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # A queued push run can start after another refresh has already
          # advanced main. Always crawl the latest branch tip, not the stale
          # event SHA that originally queued the run.
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install pinned build toolchain
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Reject stale browser bundles
        run: pnpm run test:asset-bundle-freshness

      - name: Run intelligence agent
        env:
          INTELLIGENCE_REFRESH_TRIGGER: ${{ github.event.action || inputs.refresh_scope || github.event_name }}
          INTELLIGENCE_EVENT_KEY: ${{ github.event.client_payload.idempotency_key || github.event.client_payload.event_id || github.event.client_payload.delivery_id || '' }}
          INTELLIGENCE_EVENT_OCCURRED_AT: ${{ github.event.client_payload.occurred_at || github.event.client_payload.published_at || '' }}
          INTELLIGENCE_EVENT_SOURCE: ${{ github.event.client_payload.source || github.event.action || github.event_name }}
        run: pnpm run crawl

      - name: Recover a degraded source run once
        shell: bash
        run: |
          status="$(node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('data/refresh-status.json','utf8'));process.stdout.write(String(p.status||''))")"
          if [ "$status" = "checked-degraded" ]; then
            echo "::notice::Primary discovery was degraded; retrying once through the alternate provider."
            sleep 30
            CRAWL_RECOVERY_MODE=1 CRAWL_SKIP_KO_TRANSLATION=1 pnpm run crawl
          fi

      - name: Refresh calculator account examples
        run: node scripts/refresh-calculator-examples.mjs

      - name: Pre-render executive decision snapshot
        run: pnpm run prerender:decision

      - name: Assert deployment runId coherence
        run: pnpm run test:runid-coherence

      - name: Validate refreshed intelligence
        run: pnpm run check:fast

      - name: Reject malformed generated files
        shell: bash
        run: |
          git diff --check
          test ! -n "$(find data -maxdepth 1 -name '*.tmp' -print -quit)"

      - name: Commit refreshed intelligence data
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          crawl_base="$(git rev-parse HEAD)"
          git fetch origin main
          if [ "$crawl_base" != "$(git rev-parse origin/main)" ]; then
            echo "::notice::main advanced during this crawl; a newer queued run will refresh from the latest code"
            exit 0
          fi
          git add data/live.json data/price-history.json data/market-history.json data/quant.json data/quant-backtest.json data/crawl-audit.json data/crawl-quarantine.json data/data-manifest.json data/live-client.json data/quant-client.json data/price-history-client.json data/market-history-client.json data/quant-backtest-client.json data/decision-history-client.json data/landing-decision-client.json data/site-content-client.json data/site-content-extended-client.json data/company-directory-client.json data/insight-ledger.json data/company-signals.json data/memory-demand.json data/silicon-map.json data/pain-points.json data/org-signals.json data/executive-latest.json console/index.html data/translation-cache.json data/refresh-events.json data/refresh-status.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: daily intelligence agent refresh"
            if ! git push origin HEAD:main; then
              # Never attempt a line rebase of generated JSON snapshots. A
              # concurrent code push queues another run, which will regenerate
              # the complete artifact set from the newer main tip.
              git fetch origin main
              echo "::notice::main advanced before the data push; deferring to the newer queued run"
              exit 0
            fi
          fi

      - name: Pages deployment note
        run: echo "GitHub Pages is deployed by the repository's branch-based Pages build after main updates."

  notify-source-health:
    name: Source health issue sync
    needs: agent
    if: ${{ always() && needs.agent.result != 'cancelled' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout refreshed main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Open, update, or close source-health issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CRAWL_JOB_RESULT: ${{ needs.agent.result }}
        run: node scripts/report-source-health.mjs
