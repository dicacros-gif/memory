name: Daily Intelligence Agent - Crawl & Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/research-archive.json"
      - "data/live.json"
      - "data/price-history.json"
      - "data/market-history.json"
      - "data/quant.json"
      - "data/quant-backtest.json"
      - "data/crawl-audit.json"
      - "data/crawl-quarantine.json"
      - "data/data-manifest.json"
      - "data/live-client.json"
      - "data/quant-client.json"
      - "data/price-history-client.json"
      - "data/market-history-client.json"
      - "data/quant-backtest-client.json"
      - "data/decision-history-client.json"
      - "data/landing-decision-client.json"
      - "data/site-content-client.json"
      - "data/site-content-extended-client.json"
      - "data/company-directory-client.json"
      - "data/insight-ledger.json"
      - "data/company-signals.json"
      - "data/memory-demand.json"
      - "data/silicon-map.json"
      - "data/pain-points.json"
      - "data/org-signals.json"
      - "data/investment-memo-client.json"
      - "data/terminal-client.json"
      - "data/terminal-source.json"
      - "data/terminal-ohlcv/**"
      - "data/executive-latest.json"
      - "console/index.html"
      - "data/translation-cache.json"
      - "data/refresh-events.json"
      - "data/refresh-status.json"
  schedule:
    # Four reconciliation runs per day keep the free translation endpoint
    # stable; repository_dispatch remains the low-latency event path.
    - cron: "17 */6 * * *"
  repository_dispatch:
    # Webhook/RSS relays use repository_dispatch as the low-latency path.
    # The six-hour schedule below remains the reconciliation safety poll.
    types: [earnings-release, press-release, filing-update, industry-report, source-update]
  workflow_dispatch:
    inputs:
      refresh_scope:
        description: "Refresh scope"
        required: true
        default: "full"
        type: choice
        options: [full, earnings, market, retrieval]

permissions:
  contents: write

concurrency:
  group: intelligence-agent
  # UI and strategy updates can arrive while a long crawl is running. Preserve
  # the active verified refresh and queue the newest run so frequent design
  # pushes cannot starve news freshness by repeatedly cancelling the crawler.
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    # Terminal collection (≤16 min), a crawl and its one recovery crawl (~11
    # min each) and four browser audits leave no room under 55 minutes on a
    # slow day; a timeout would discard the whole run.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # A queued push run can start after another refresh has already
          # advanced main. Always crawl the latest branch tip, not the stale
          # event SHA that originally queued the run.
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install pinned build toolchain
        shell: bash
        run: |
          corepack enable
          # A registry blip must not cost the day's refresh.
          for attempt in 1 2 3; do
            pnpm install --frozen-lockfile && break
            [ "$attempt" = 3 ] && exit 1
            echo "::warning::pnpm install failed (attempt $attempt); retrying"
            sleep $((attempt * 15))
          done

      - name: Reject stale browser bundles
        run: pnpm run test:asset-bundle-freshness

      # Market data the browser cannot fetch itself: valuation multiples,
      # consensus, earnings dates, estimate revisions and OHLCV bars through
      # OpenBB's free yfinance provider, FRED and the KRX listing through
      # FinanceDataReader, and a delayed TradingView semiconductor screen. Each
      # source is fail-soft: a failure keeps the last collected values and the
      # crawl below still publishes.
      - name: Setup Python for the terminal collector
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/terminal/requirements.txt

      - name: Install OpenBB, FinanceDataReader and TradingView-Screener
        id: terminal-install
        continue-on-error: true
        run: python -m pip install -r scripts/terminal/requirements.txt

      - name: Collect semiconductor terminal data
        if: steps.terminal-install.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 16
        env:
          TERMINAL_BUDGET_SECONDS: "600"
        run: python scripts/terminal/collect_market.py

      - name: Run intelligence agent
        shell: bash
        env:
          INTELLIGENCE_REFRESH_TRIGGER: ${{ github.event.action || inputs.refresh_scope || github.event_name }}
          INTELLIGENCE_EVENT_KEY: ${{ github.event.client_payload.idempotency_key || github.event.client_payload.event_id || github.event.client_payload.delivery_id || '' }}
          INTELLIGENCE_EVENT_OCCURRED_AT: ${{ github.event.client_payload.occurred_at || github.event.client_payload.published_at || '' }}
          INTELLIGENCE_EVENT_SOURCE: ${{ github.event.client_payload.source || github.event.action || github.event_name }}
        run: |
          crawl() {
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              pnpm run crawl:console
            else
              pnpm run crawl
            fi
          }
          # A degraded crawl exits 0 and is handled below; a non-zero exit is a
          # crash (network or runner), which gets one fresh attempt. Writes
          # are atomic, so a crashed attempt leaves the last bundle intact.
          if ! crawl; then
            echo "::warning::crawl exited non-zero; retrying once"
            sleep 60
            crawl
          fi

      - name: Recover a degraded source run once
        shell: bash
        run: |
          status="$(node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('data/refresh-status.json','utf8'));process.stdout.write(String(p.status||''))")"
          if [ "$status" = "checked-degraded" ]; then
            echo "::notice::Primary discovery was degraded; retrying once through the alternate provider."
            sleep 30
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              CRAWL_RECOVERY_MODE=1 pnpm run crawl:console
            else
              CRAWL_RECOVERY_MODE=1 pnpm run crawl
            fi
          fi

      - name: Synchronize retained verified clients after a degraded crawl
        shell: bash
        run: |
          status="$(node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('data/refresh-status.json','utf8'));process.stdout.write(String(p.status||''))")"
          if [ "$status" = "checked-degraded" ]; then
            node scripts/refresh-client-artifacts.mjs --console-only
          fi

      - name: Accumulate research citation archive
        run: node scripts/build-research-archive.mjs

      - name: Pre-render executive decision snapshot
        run: pnpm run prerender:decision

      - name: Rebuild cache-busted browser assets
        # The crawl can update data/mbb-frames.json, which participates in the
        # public client revision. Recompute the revision and its minified
        # bundle before the freshness gate evaluates the generated snapshot.
        run: pnpm run build:assets

      - name: Assert deployment runId coherence
        run: pnpm run test:runid-coherence

      - name: Validate refreshed intelligence
        run: pnpm run check:fast

      - name: Audit public copy and real button states
        timeout-minutes: 12
        shell: bash
        # A rendering regression fails both attempts and still blocks the
        # commit; a one-off browser or runner hiccup does not.
        run: pnpm run audit:public-experience:quick || { echo "::warning::audit:public-experience:quick failed; retrying once"; sleep 20; pnpm run audit:public-experience:quick; }

      # Contrast can only be measured on the rendered page: a colour may be
      # painted by -webkit-text-fill-color rather than color, and a surface is
      # usually a stack of translucent layers. This drives the runner's Chrome
      # over the landing page and the console, at desktop and phone widths, with
      # and without :hover forced. It skips itself if no Chrome build is found.
      - name: Audit rendered text contrast
        timeout-minutes: 16
        shell: bash
        # A rendering regression fails both attempts and still blocks the
        # commit; a one-off browser or runner hiccup does not.
        run: pnpm run audit:contrast || { echo "::warning::audit:contrast failed; retrying once"; sleep 20; pnpm run audit:contrast; }

      - name: Audit console hover contrast
        timeout-minutes: 8
        shell: bash
        # A rendering regression fails both attempts and still blocks the
        # commit; a one-off browser or runner hiccup does not.
        run: pnpm run audit:contrast:console-hover || { echo "::warning::audit:contrast:console-hover failed; retrying once"; sleep 20; pnpm run audit:contrast:console-hover; }

      - name: Audit responsive layout and price-tab order
        timeout-minutes: 10
        shell: bash
        # A rendering regression fails both attempts and still blocks the
        # commit; a one-off browser or runner hiccup does not.
        run: pnpm run audit:layout || { echo "::warning::audit:layout failed; retrying once"; sleep 20; pnpm run audit:layout; }

      - name: Reject malformed generated files
        shell: bash
        run: |
          git diff --check
          test ! -n "$(find data -maxdepth 1 -name '*.tmp' -print -quit)"

      - name: Commit refreshed intelligence data
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          crawl_base="$(git rev-parse HEAD)"
          git fetch origin main
          if [ "$crawl_base" != "$(git rev-parse origin/main)" ]; then
            echo "::notice::main advanced during this crawl; a newer queued run will refresh from the latest code"
            exit 0
          fi
          git add index.html assets/js/landing.js assets/js/landing.min.js data/research-archive.json data/mbb-frames.json data/live.json data/price-history.json data/market-history.json data/quant.json data/quant-backtest.json data/crawl-audit.json data/crawl-quarantine.json data/data-manifest.json data/live-client.json data/quant-client.json data/price-history-client.json data/market-history-client.json data/quant-backtest-client.json data/decision-history-client.json data/landing-decision-client.json data/site-content-client.json data/site-content-extended-client.json data/company-directory-client.json data/console-capital-plans.json data/console-chip-roadmap.json data/insight-ledger.json data/company-signals.json data/memory-demand.json data/silicon-map.json data/pain-points.json data/org-signals.json data/investment-memo-client.json data/terminal-client.json data/terminal-source.json data/terminal-ohlcv data/executive-latest.json console/index.html data/translation-cache.json data/refresh-events.json data/refresh-status.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: daily intelligence agent refresh"
            if ! git push origin HEAD:main; then
              # Never attempt a line rebase of generated JSON snapshots. A
              # concurrent code push queues another run, which will regenerate
              # the complete artifact set from the newer main tip.
              git fetch origin main
              echo "::notice::main advanced before the data push; deferring to the newer queued run"
              exit 0
            fi
          fi

      - name: Pages deployment note
        run: echo "GitHub Pages is deployed by the repository's branch-based Pages build after main updates."

  notify-source-health:
    name: Source health issue sync
    needs: agent
    if: ${{ always() && needs.agent.result != 'cancelled' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout refreshed main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Open, update, or close source-health issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CRAWL_JOB_RESULT: ${{ needs.agent.result }}
        run: node scripts/report-source-health.mjs
