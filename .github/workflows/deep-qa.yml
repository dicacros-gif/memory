name: Nightly Decision Intelligence Deep QA

on:
  schedule:
    - cron: "47 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deep-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout latest verified main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install pinned QA toolchain
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Run full regression, performance and content audit
        run: pnpm run check:deep

      - name: Audit responsive design
        timeout-minutes: 5
        run: pnpm run audit:layout

      - name: Audit all routes, themes and interaction states
        timeout-minutes: 10
        run: pnpm run audit:public-experience

      - name: Audit text inside clipped ancestors and narrow cards
        timeout-minutes: 12
        run: pnpm run audit:text-reflow

      - name: Retain text reflow findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: text-reflow-audit
          path: .tmp/text-reflow-audit.json
          if-no-files-found: ignore
