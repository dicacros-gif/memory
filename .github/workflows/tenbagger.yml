name: Ten-bagger research data

# Daily rebuild of the ten-bagger research data (data/tenbagger/*), separate
# from the intelligence crawl so neither can block or discard the other.
# Cheap grouped requests run first (TradingView: one scan per market; Yahoo
# cohort: batched), per-company requests after, each with its own budget.
# Every collector keeps the last good value on failure; the audit restores the
# previous committed files if the new ones break an integrity rule. The relay
# (scripts/refresh-relay.mjs) dispatches this workflow when the data is older
# than a day, so a dropped schedule slot does not stop the refresh.
on:
  workflow_dispatch:
    inputs:
      force_cohort:
        description: "Rebuild the historical cohort even if it is less than a week old"
        type: boolean
        default: false
  schedule:
    - cron: "17 21 * * *"
  push:
    branches: [main]
    paths:
      - "data/tenbagger/universe.json"
      - "scripts/tenbagger-*.mjs"
      - "scripts/tenbagger/**"
      - ".github/workflows/tenbagger.yml"

permissions:
  contents: write

concurrency:
  group: tenbagger
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/tenbagger/requirements.txt

      - name: Install collectors
        run: python -m pip install -r scripts/tenbagger/requirements.txt

      - name: Market scan (TradingView, one request per market)
        continue-on-error: true
        timeout-minutes: 10
        run: python scripts/tenbagger/collect_tv.py || echo "::warning::TradingView scan failed; previous screen kept"

      - name: FX table (FRED)
        continue-on-error: true
        timeout-minutes: 3
        run: node scripts/tenbagger-fx.mjs || echo "::warning::FX refresh failed; previous rates kept"

      - name: Prices, bars and statements (Yahoo via yfinance)
        continue-on-error: true
        timeout-minutes: 22
        run: python scripts/tenbagger/collect_yf.py || echo "::warning::yfinance step failed; previous prices kept"

      - name: Historical cohort (weekly, batched)
        continue-on-error: true
        timeout-minutes: 22
        run: python scripts/tenbagger/collect_cohort.py ${{ inputs.force_cohort && '--force' || '' }} || echo "::warning::cohort step failed; previous base rates kept"

      - name: Korean statements (DART, when the DART_API_KEY secret exists)
        continue-on-error: true
        timeout-minutes: 10
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: node scripts/tenbagger-dart.mjs || echo "::warning::DART step failed; snapshots kept"

      - name: Metrics, screen, company data layer, source checks
        continue-on-error: true
        timeout-minutes: 15
        run: |
          node scripts/tenbagger-collect.mjs || echo "::warning::metrics refresh failed; previous numbers kept"
          node scripts/tenbagger-screen.mjs || echo "::warning::market screen failed; previous screen kept"
          node scripts/tenbagger-build.mjs || echo "::warning::company data build failed; previous files kept"
          node scripts/tenbagger-positioning.mjs || echo "::warning::positioning monitor failed; previous file kept"
          node scripts/tenbagger-verify-sources.mjs || echo "::warning::source re-check failed; previous results kept"

      - name: Integrity audit
        id: audit
        shell: bash
        run: |
          if node scripts/tenbagger-audit.mjs; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::error::audit failed; restoring the last committed ten-bagger data"
            git checkout -- data/tenbagger
            git clean -fdq data/tenbagger
          fi

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tenbagger
          git reset -q -- data/tenbagger/yf-cache.json data/tenbagger/tv-cache.json data/tenbagger/dart-cache.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "No ten-bagger changes."; exit 0; fi
          git commit -q -m "data: ten-bagger research refresh"
          # Only data/tenbagger changes here. The crawl commits other paths;
          # if anything else touched these generated files meanwhile, this
          # run's freshly built files win (-X theirs keeps the replayed commit).
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 5))
            if ! git pull --rebase -X theirs -q origin main; then
              # Rebase still failed: rebuild the commit on the latest main from
              # this run's data/tenbagger files only, never touching other paths.
              git rebase --abort || true
              rm -rf /tmp/tb && cp -r data/tenbagger /tmp/tb
              git fetch -q origin main && git reset -q --hard origin/main
              rm -rf data/tenbagger && cp -r /tmp/tb data/tenbagger
              git add data/tenbagger
              git reset -q -- data/tenbagger/yf-cache.json data/tenbagger/tv-cache.json data/tenbagger/dart-cache.json 2>/dev/null || true
              git commit -q -m "data: ten-bagger research refresh" || exit 0
            fi
          done
          exit 1

      - name: Fail when the audit failed
        if: steps.audit.outputs.ok == 'false'
        run: exit 1
