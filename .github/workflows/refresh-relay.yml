name: Refresh relay

# GitHub starts this repository's scheduled runs hours late and drops slots,
# so the crawl's own freshness gate cannot be the only trigger. This relay
# does not depend on the scheduler: one job waits until the published data is
# due, dispatches the crawl, and dispatches its own successor before its time
# limit (see scripts/refresh-relay.mjs). The cron entries only restart the
# chain if it ever breaks; with one run active and at most one pending in the
# concurrency group, a restart never doubles it.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 */6 * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: refresh-relay
  cancel-in-progress: false

jobs:
  relay:
    name: Dispatch the crawl when data is due
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout relay
        uses: actions/checkout@v7
        with:
          ref: main
          sparse-checkout: scripts/refresh-relay.mjs
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Wait, dispatch, hand over
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/refresh-relay.mjs
